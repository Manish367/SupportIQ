services:
  - type: web
    name: supportiq-ml
    runtime: python
    rootDir: ml-service
    buildCommand: pip install -r requirements.txt && python make_dataset.py && python train.py
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars: [{ key: ML_API_KEY, sync: false }]
  - type: web
    name: supportiq-api
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - { key: MONGODB_URI, sync: false }
      - { key: ML_SERVICE_URL, sync: false }   # https://supportiq-ml.onrender.com
      - { key: ML_API_KEY, sync: false }       # same value as the ML service
      - { key: CORS_ORIGIN, sync: false }      # your Vercel URL
